[project]
name = "receipts"
version = "0.1.0"
description = "Receipt arithmetic for the sandbox Target Project."
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
