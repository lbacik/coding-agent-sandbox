[project]
name = "sandbox-pricing"
version = "0.1.0"
description = "coding-agent sandbox seed: a small, real Python project for agent implement runs."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
